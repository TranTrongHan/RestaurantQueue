version: '3.8'

services:
  restaurant-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: restaurant-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/restaurantdb?useSSL=false&serverTimezone=%2B07:00&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false&forceConnectionTimeZoneToSession=true
      - SPRING_DATA_REDIS_HOST=host.docker.internal
      - SPRING_DATA_REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
